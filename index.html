<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Cigarette Break</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/dm-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The only light on the page. Positioned and dimmed by the flame. -->
  <div class="pageglow" id="pageglow" aria-hidden="true"></div>

  <main class="app" id="app" data-state="boot" data-orientation="horizontal">

    <section class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></section>

    <section class="stage" id="stage" aria-label="Computation" hidden>
      <div class="camera" id="camera" hidden>
        <div class="camera__frame">
          <video id="video" playsinline muted autoplay disablepictureinpicture aria-label="Camera preview, mirrored"></video>
          <canvas class="camera__debug" id="debugCanvas" hidden></canvas>
          <div class="camera__guide" aria-hidden="true"></div>
        </div>
      </div>

      <p class="caption" id="caption"></p>

      <div class="burn" id="burn" role="progressbar" aria-label="Computation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="burnCanvas"></canvas>
      </div>

      <p class="readout" id="readout" aria-hidden="true" hidden>
        <span class="readout__percent" id="percent">100%</span>
        <span class="readout__clock" id="clock">00:00</span>
      </p>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <label class="visually-hidden" for="prompt">Message</label>
      <input class="composer__input" id="prompt" name="prompt" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" disabled>
      <button class="composer__send" id="send" type="submit" disabled>Send</button>
    </form>

    <p class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></p>
  </main>

  <dialog class="output" id="output" aria-labelledby="outputTitle">
    <h2 class="visually-hidden" id="outputTitle">Output</h2>
    <p class="output__text" id="outputText"></p>
    <button class="btn" id="outputClose" type="button">close</button>
  </dialog>

  <pre class="debug" id="debugPanel" hidden></pre>

  <noscript><p class="noscript">This page needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
